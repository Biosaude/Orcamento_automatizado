[project]
name = "biosaude-opme-automation"
version = "0.1.0"
description = "Base do MVP empresarial Biosaúde para automação supervisionada de orçamentos OPME"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.12",
    "pydantic==2.11.4",
    "pydantic-settings==2.9.1",
    "streamlit==1.45.1",
    "uvicorn==0.34.2",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.5",
    "ruff==0.11.10",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "frontend", "workers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
